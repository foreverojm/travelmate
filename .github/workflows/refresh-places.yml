name: Refresh OSM places

# 매주 월요일 03:00 UTC 에 자동 실행 + 수동 실행 가능.
# fetch_osm.py 로 최신 데이터를 받아 assets/data/osm_places.json 을 갱신·커밋한다.
# 앱은 이 파일의 raw URL 에서 데이터를 받으므로, 갱신에 앱 업데이트가 필요 없다.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-08-03 run 실패 원인: 기본값(depth 1, 얕은 클론)에서는 아래 rebase 후에도
          # 푸시가 non-fast-forward 로 거부된다(! [rejected] main -> main (fetch first)).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch OSM places
        run: python tools/fetch_osm.py

      - name: Commit if changed
        run: |
          git config user.name  "travelmate-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- assets/data/osm_places.json; then
            echo "No changes."
            exit 0
          fi

          git add assets/data/osm_places.json
          git commit -m "chore: refresh OSM places ($(date -u +%Y-%m-%d))"

          # 사람이 그 사이 푸시했을 수 있으니 rebase 후 재시도(경쟁 방지).
          # 반드시 if 로 감쌀 것: `git pull && git push && break` 형태면 push 실패 시
          # set -e 가 즉시 스크립트를 죽여 재시도가 아예 돌지 않는다(2026-08-03 실패 원인).
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed (attempt $i)"
              exit 0
            fi
            echo "push attempt $i failed"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "::error::푸시 3회 모두 실패. 원격이 앞서 있거나(경쟁) 인증 문제일 수 있습니다."
          exit 1
